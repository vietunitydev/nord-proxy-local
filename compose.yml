x-nordvpn: &nordvpn
  image: edgd1er/nordlynx-proxy:latest
  restart: unless-stopped
  privileged: true
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun
  sysctls:
    - net.ipv6.conf.all.disable_ipv6=1

services:
  proxy-jp:
    <<: *nordvpn
    container_name: nordvpn-jp
    ports:
      - "127.0.0.1:34180:1080" # SOCKS5 Japan
      - "127.0.0.1:34188:8888" # HTTP Japan
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - COUNTRY=Japan
      - GROUP=
      - TECHNOLOGY=NordLynx
      - ANALYTICS=off
      - DNS=1.1.1.1 8.8.8.8
      - NORDVPN_TOKEN=${NORDVPN_TOKEN}

  proxy-us:
    <<: *nordvpn
    container_name: nordvpn-us
    ports:
      - "127.0.0.1:34181:1080" # SOCKS5 US
      - "127.0.0.1:34189:8888" # HTTP US
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - COUNTRY=United_States
      - GROUP=
      - TECHNOLOGY=NordLynx
      - ANALYTICS=off
      - DNS=1.1.1.1 8.8.8.8
      - NORDVPN_TOKEN=${NORDVPN_TOKEN}

  proxy-sg:
    <<: *nordvpn
    container_name: nordvpn-sg
    ports:
      - "127.0.0.1:34182:1080" # SOCKS5 Singapore
      - "127.0.0.1:34190:8888" # HTTP Singapore
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - COUNTRY=Singapore
      - GROUP=
      - TECHNOLOGY=NordLynx
      - ANALYTICS=off
      - DNS=1.1.1.1 8.8.8.8
      - NORDVPN_TOKEN=${NORDVPN_TOKEN}
